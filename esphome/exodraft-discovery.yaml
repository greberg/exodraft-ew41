# Discovery firmware: listens to all Z-Wave R2 traffic on 868.42 MHz and logs
# every valid frame. Use it once to find your Home ID, the power unit's node ID
# and your CC1101's frequency offset, then switch to example-device.yaml.
#
# Wake the EW41 panel (press any button) a few times while watching the log.
# Look for lines like:
#   FRAME home=D4E36193 src=1 dst=9 len=17 rssi=-54 foff=49194 ...
# src=1 is the panel, dst is the power unit's node ID.
# Note that this mode mostly catches the panel's frames; the power unit's replies
# follow too closely to be received with a fixed packet length. That is expected.

esphome:
  name: exodraft
  friendly_name: Exodraft

esp32:
  board: esp32dev

logger:
  level: DEBUG
  logs:
    cc1101: ERROR

api:
  encryption:
    key: !secret exodraft_api_key

ota:
  - platform: esphome
    password: !secret exodraft_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

cc1101:
  id: radio
  cs_pin: GPIO5
  gdo0_pin: GPIO4
  frequency: 868.42MHz
  modulation_type: 2-FSK
  symbol_rate: 40000
  fsk_deviation: 20kHz
  filter_bandwidth: 325kHz
  packet_mode: true
  packet_length: 32
  crc_enable: false
  whitening: false
  sync_mode: 16/16
  sync1: 0xAA
  sync0: 0x0F
  on_packet:
    then:
      - lambda: |-
          if (rssi < -95) return;
          std::vector<uint8_t> f;
          for (auto b : x) f.push_back((uint8_t) (b ^ 0xFF));
          if (f.size() < 10) return;
          uint8_t len = f[7];
          if (len < 10 || len > f.size()) return;
          uint8_t cs = 0xFF;
          for (int i = 0; i < len - 1; i++) cs ^= f[i];
          if (cs != f[len - 1]) return;
          std::vector<uint8_t> frame(f.begin(), f.begin() + len);
          ESP_LOGI("discovery", "FRAME home=%02X%02X%02X%02X src=%u dst=%u len=%u rssi=%.0f foff=%.0f %s",
                   f[0], f[1], f[2], f[3], f[4], f[8], len, rssi, freq_offset,
                   format_hex_pretty(frame).c_str());
