esphome:
  name: exodraft
  friendly_name: Exodraft

esp32:
  board: esp32dev

logger:
  level: DEBUG

api:
  encryption:
    key: !secret exodraft_api_key

ota:
  - platform: esphome
    password: !secret exodraft_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

cc1101:
  id: radio
  cs_pin: GPIO5
  gdo0_pin: GPIO4
  frequency: 868.42MHz
  modulation_type: 2-FSK
  symbol_rate: 40000
  fsk_deviation: 20kHz
  filter_bandwidth: 203kHz
  packet_mode: true
  packet_length: 32
  crc_enable: false
  whitening: false
  sync_mode: 16/16
  sync1: 0x55
  sync0: 0xF0
  on_packet:
    then:
      - lambda: |-
          if (x.size() < 10) return;
          bool home = x[0] == 0xD4 && x[1] == 0xE3 && x[2] == 0x61 && x[3] == 0x93;
          if (!home) {
            ESP_LOGV("exo", "annat nät rssi=%.0f %s", rssi, format_hex_pretty(x).c_str());
            return;
          }
          uint8_t len = x[7];
          if (len < 10 || len > x.size()) {
            ESP_LOGW("exo", "ogiltig längd %u rssi=%.0f %s", len, rssi, format_hex_pretty(x).c_str());
            return;
          }
          uint8_t cs = 0xFF;
          for (int i = 0; i < len - 1; i++) cs ^= x[i];
          bool ok = (cs == x[len - 1]);
          std::vector<uint8_t> frame(x.begin(), x.begin() + len);
          ESP_LOGI("exo", "%s src=%u dst=%u rssi=%.0f foff=%.0f %s",
                   ok ? "OK " : "BAD", x[4], x[8], rssi, freq_offset,
                   format_hex_pretty(frame).c_str());
          if (!ok) return;
          id(exo_rssi).publish_state(rssi);
          if (x[4] == 9 && len == 26 && x[9] == 0x91 && x[10] == 0x00 && x[11] == 0x04) {
            id(exo_power).publish_state((x[17] << 8) | x[18]);
            id(exo_temp).publish_state((x[19] << 8) | x[20]);
            id(exo_pressure).publish_state((x[21] << 8) | x[22]);
            id(exo_pressure_sp).publish_state(x[23]);
            id(exo_speed).publish_state(x[24]);
            id(exo_mode).publish_state(x[16]);
          }
          if (x[4] == 1 && x[8] == 9 && len == 13 && x[9] == 0x26 && x[10] == 0x01) {
            ESP_LOGI("exo", "Panelen satte varvtal %u %%", x[11]);
          }

sensor:
  - platform: template
    id: exo_temp
    name: Skorstenstemperatur
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: exo_power
    name: Fläkteffekt
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: exo_pressure
    name: Skorstensdrag
    unit_of_measurement: Pa
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: exo_pressure_sp
    name: Tryckbörvärde
    unit_of_measurement: Pa
    device_class: pressure
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: exo_speed
    name: Fläktvarvtal
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: exo_mode
    name: Driftläge (rå)
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: exo_rssi
    name: Radiosignal
    unit_of_measurement: dBm
    device_class: signal_strength
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: never
