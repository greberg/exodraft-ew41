<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" font-family="Helvetica, Arial, sans-serif">
  <rect width="680" height="500" fill="#ffffff"/>
  <rect x="110" y="50" width="160" height="380" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="190" y="38" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">CC1101 868 MHz</text>
